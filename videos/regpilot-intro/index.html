<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #EEF2F6;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-letter"
        class="scene"
        data-composition-id="01-letter"
        data-composition-src="compositions/frames/01-letter.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-02-exceptions"
        class="scene"
        data-composition-id="02-exceptions"
        data-composition-src="compositions/frames/02-exceptions.html"
        data-start="4.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-regpilot"
        class="scene"
        data-composition-id="03-regpilot"
        data-composition-src="compositions/frames/03-regpilot.html"
        data-start="10"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-gate"
        class="scene"
        data-composition-id="04-gate"
        data-composition-src="compositions/frames/04-gate.html"
        data-start="15"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-the-line"
        class="scene"
        data-composition-id="05-the-line"
        data-composition-src="compositions/frames/05-the-line.html"
        data-start="19.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-see-why"
        class="scene"
        data-composition-id="06-see-why"
        data-composition-src="compositions/frames/06-see-why.html"
        data-start="26"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
